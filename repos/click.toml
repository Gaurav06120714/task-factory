# Everything repo-specific lives here. The factory code itself is repo-agnostic:
# add zod.toml / jsoncpp.toml with the same keys to point it at another repo.
name = "click"
url = "https://github.com/pallets/click"
base_commit = "cf19179e8e2fd54c601378cec9e0d21bb12b6fb1"  # tag 8.5.1
license = "BSD-3-Clause"
language = "python"

# Where generated feature tests are placed inside the repo.
test_dir = "tests"

# Must write JUnit XML to {junit}. JUnit is the common format pytest, vitest and ctest can all emit.
test_cmd = "python -m pytest -p no:cacheprovider -q --continue-on-collection-errors --junitxml={junit} tests"

# How the generator agent runs tests on the host while it works (final validation is in Docker).
agent_bash = ["python -m pytest:*"]
agent_env = { PYTHONPATH = "src" }
agent_test_hint = "Run tests with: python -m pytest -q -p no:cacheprovider <path>"
# Used by the local-model backend, which runs tests itself; {path} is a file or the test dir.
host_test_cmd = "python -m pytest -q -p no:cacheprovider {path}"
# Local-model backend: each feature is one new module that the factory exports.
new_module = "src/click/{module}.py"
export_file = "src/click/__init__.py"
export_line = "from .{module} import {symbol} as {symbol}"
import_check = "python -c 'import click; click.{symbol}'"
local_impl_hint = """Inside the package, import click's own pieces with relative imports from the module
that defines them, e.g. `from .types import ParamType` and `from .core import Context, Parameter`.
A ParamType reports bad input with `self.fail(message, param, ctx)` inside `convert()`."""
# Feature themes for the local model, which cannot brainstorm varied ideas on its own.
# One line each; the model writes the actual feature spec, code, tests and requirement doc.
local_themes = [
  "a parameter type that parses human-readable byte sizes such as 10KB, 1.5MiB or 2G into an int",
  "a parameter type that splits a delimited list such as a,b,c and converts every item with another type",
  "a parameter type that parses KEY=VALUE pairs into a tuple, with clear errors for malformed input",
  "a helper that renders rows of data as an aligned plain-text table with a header line",
  "a parameter type that parses and validates semantic version strings such as 1.2.3-rc.1",
  "a parameter type that validates an IPv4 or IPv6 address or network using the ipaddress module",
]
# Where the feature lives; the patch may only touch these paths.
source_paths = ["src", "docs", "CHANGES.md"]

dockerfile = """
FROM python:3.12-slim
# less: click's pager tests shell out to it.
RUN apt-get update && apt-get install -y --no-install-recommends git less \\
    && rm -rf /var/lib/apt/lists/*
# Fetch only the base commit so the agent cannot see later upstream history.
RUN git init -q /app/repo && cd /app/repo \\
    && git fetch -q --depth 1 {url} {base_commit} \\
    && git checkout -q FETCH_HEAD
WORKDIR /app/repo
RUN pip install --no-cache-dir -e . pytest==8.4.1
"""
