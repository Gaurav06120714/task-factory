schema_version = "1.4"
artifacts = []

[task]
name = "taskfactory/click-duration-param-type"
version = "1.0.0"
description = "Add a click.Duration parameter type for human-readable time spans"
authors = []
keywords = ["click", "param-type", "parsing", "timedelta"]

[metadata]
repo_url = "https://github.com/pallets/click"
repo_name = "click"
base_commit = "cf19179e8e2fd54c601378cec9e0d21bb12b6fb1"
license = "BSD-3-Clause"
language = "python"
area = "types"
change_kind = "new_public_api"
difficulty = "medium"
category = "software_engineering"
tags = ["click", "param-type", "parsing", "timedelta"]

[verifier]
timeout_sec = 900.0
# Tests run in a fresh copy of the environment; the agent's work arrives only as a
# git diff, so nothing the agent does to the sandbox can touch the grader.
environment_mode = "separate"

[verifier.env]

[[verifier.collect]]
command = "mkdir -p /logs/artifacts && cd /app/repo && git add -A && git diff --cached --binary HEAD > /logs/artifacts/agent.patch"

[agent]
timeout_sec = 1800.0

[environment]
network_mode = "public"
build_timeout_sec = 900.0
os = "linux"
mcp_servers = []

[environment.env]

[solution.env]
